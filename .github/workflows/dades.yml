name: Actualitza dades
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dades.yml'
permissions:
  contents: write
jobs:
  dades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixa i converteix els CSV
        run: |
          set -e
          mkdir -p data
          python3 -m pip install --quiet beautifulsoup4 pandas lxml
          python3 - <<'PY'
          import csv, io, json, urllib.request, datetime, os, re
          today = datetime.date.today()
          season_start = today.year if today.month >= 7 else today.year - 1
          seasons = [f"{(season_start-1)%100:02d}{season_start%100:02d}", f"{season_start%100:02d}{(season_start+1)%100:02d}"]
          def parse_date(value):
              for fmt in ("%d/%m/%Y", "%d/%m/%y"):
                  try: return datetime.datetime.strptime(value, fmt).strftime("%Y-%m-%d")
                  except ValueError: pass
              return None
          for league in ("SP1", "SP2"):
              matches = {}
              for season in seasons:
                  url = f"https://www.football-data.co.uk/mmz4281/{season}/{league}.csv"
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"QuiniGol-data-updater/1.0"})
                      raw = urllib.request.urlopen(req, timeout=45).read()
                      reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig", errors="replace")))
                      for row in reader:
                          date = parse_date((row.get("Date") or "").strip())
                          hg, ag = (row.get("FTHG") or "").strip(), (row.get("FTAG") or "").strip()
                          home, away = (row.get("HomeTeam") or "").strip(), (row.get("AwayTeam") or "").strip()
                          if date and hg.isdigit() and ag.isdigit() and home and away:
                              matches[(date,home,away)] = [date,home,away,int(hg),int(ag)]
                      print(f"{league} {season}: CSV llegit")
                  except Exception as exc:
                      print(f"{league} {season}: {exc}")
              rows = sorted(matches.values())
              if not rows:
                  raise SystemExit(f"No s'han pogut obtenir dades vàlides per {league}; no es publica cap actualització.")
              with open(f"data/{league}.json","w",encoding="utf-8") as out:
                  json.dump(rows,out,separators=(",",":"),ensure_ascii=False)
              print(f"{league}: {len(rows)} partits guardats; últim: {rows[-1][0]}")
          # Fonts opcionals: si fallen, no bloquegen ni esborren SP1/SP2.
          try:
              req = urllib.request.Request("https://raw.githubusercontent.com/martj42/international_results/master/results.csv", headers={"User-Agent":"QuiniGol-data-updater/1.0"})
              raw = urllib.request.urlopen(req, timeout=90).read()
              reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig", errors="replace")))
              intl = []
              for row in reader:
                  date = (row.get("date") or "").strip()
                  try: dt = datetime.datetime.strptime(date, "%Y-%m-%d").date()
                  except ValueError: continue
                  if dt < today - datetime.timedelta(days=365*8): continue
                  try: hg, ag = int(row["home_score"]), int(row["away_score"])
                  except (ValueError, KeyError, TypeError): continue
                  home, away = (row.get("home_team") or "").strip(), (row.get("away_team") or "").strip()
                  if home and away: intl.append([dt.isoformat(), home, away, hg, ag])
              if len(intl) >= 300:
                  with open("data/INT.json","w",encoding="utf-8") as out: json.dump(intl,out,separators=(",",":"),ensure_ascii=False)
                  print(f"INT: {len(intl)} partits internacionals")
              else: print("INT: dades insuficients; es conserva la versió anterior.")
          except Exception as exc: print(f"INT opcional no disponible: {exc}")

          # Liga F: dades públiques, sense claus ni API de pagament.
          import pandas as pd
          import warnings
          warnings.filterwarnings("ignore")
          lf_rows = []
          sources = [
              ("LaLiga", "https://www.laliga.com/futbol-femenino/clasificacion"),
              ("FemGol", "https://femgol.com/en/liga-f/standings/")
          ]
          for source_name, url in sources:
              try:
                  tables = pd.read_html(url)
                  for table in tables:
                      cols = {str(col).strip().lower(): col for col in table.columns}
                      def col(*names):
                          return next((cols[n] for n in names if n in cols), None)
                      team_col = col("equipo","team","squad")
                      played_col = col("pj","p","mp","partidos")
                      gf_col = col("gf","goals for")
                      ga_col = col("gc","ga","goals against")
                      if not all((team_col,played_col,gf_col,ga_col)): continue
                      for _, row in table.iterrows():
                          team = str(row[team_col]).strip()
                          team = re.sub(r"\\s+PG\\d+.*$", "", team).strip()
                          team = {"Barcelona":"FC Barcelona","Real Madrid":"Real Madrid CF","Atlético":"Atlético de Madrid","Espanyol":"RCD Espanyol de Barcelona","Tenerife":"Costa Adeje Tenerife","Eibar":"SD Eibar","Dépor":"Deportivo Abanca","Granada":"Granada CF","Sevilla":"Sevilla FC","Alavés":"Deportivo Alavés","Badalona":"FC Badalona Women","Valencia":"VCF Femenino","Logroño":"Logroño United"}.get(team,team)
                          if not team or team.lower() in ("nan","equipo","team"): continue
                          try:
                              played, gf, ga = int(row[played_col]), int(row[gf_col]), int(row[ga_col])
                          except Exception: continue
                          if played <= 0 or gf < 0 or ga < 0: continue
                          points_col, pos_col = col("pts","points"), col("pos","rk","rk.")
                          item = {"team":team,"played":played,"gf":gf,"ga":ga,"source":source_name}
                          if points_col:
                              try: item["points"] = int(row[points_col])
                              except Exception: pass
                          if pos_col:
                              try: item["position"] = int(row[pos_col])
                              except Exception: pass
                          lf_rows.append(item)
                      if len(lf_rows) >= 12: break
                  if len(lf_rows) >= 12:
                      print(f"Liga F obtinguda de {source_name}: {len(lf_rows)} equips")
                      break
              except Exception as exc:
                  print(f"Font Liga F {source_name} no disponible: {exc}")
          if len(lf_rows) >= 12:
              with open("data/LF.json","w",encoding="utf-8") as out:
                  json.dump(lf_rows,out,ensure_ascii=False,indent=2)
          else:
              print("No s'han pogut llegir dades obertes suficients de Liga F; es conserva l'últim fitxer.")

          # Registre de fonts públiques i estat de les baixes.
          availability = {
              "updated": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": "Fonts públiques",
              "configured": True,
              "leagues": [],
              "absences": [],
              "notes": "Les lesions i sancions només s'incorporen quan una font pública les identifica explícitament. No trobar una notícia no significa absència de baixes.",
              "sources": [
                  {"name":"RFEF","url":"https://rfef.es/es"},
                  {"name":"Futbol Total - Liga F","url":"https://futboltotal.futbol/league/primera-division-femenina/noticias/"},
                  {"name":"Mundo Deportivo - Femení","url":"https://www.mundodeportivo.com/futbol/femenino"}
              ]
          }
          try:
              from bs4 import BeautifulSoup
              url = "https://futboltotal.futbol/league/primera-division-femenina/noticias/"
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 QuiniGol/1.0"})
              html = urllib.request.urlopen(req, timeout=45).read()
              soup = BeautifulSoup(html,"html.parser")
              for link in soup.select("a[href]"):
                  title = " ".join(link.get_text(" ",strip=True).split())
                  href = link.get("href","")
                  low = title.lower()
                  if href.startswith("/") : href = "https://futboltotal.futbol"+href
                  if href.startswith("http") and any(word in low for word in ("sancion","lesion","baja","expulsion")):
                      availability["sources"].append({"name":title[:140],"url":href})
              print(f"Fonts públiques de baixes trobades: {len(availability['sources'])}")
          except Exception as exc:
              print(f"No s'ha pogut llegir el llistat públic de notícies de baixes: {exc}")
          with open("data/availability.json","w",encoding="utf-8") as out:
              json.dump(availability,out,ensure_ascii=False,indent=2)
          PY
      - name: Desa els canvis
        run: |
          git config user.name "dades-bot"
          git config user.email "dades-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Actualitza resultats de les lligues"
            git pull --rebase origin main
            git push
          else
            echo "Les dades ja estan actualitzades."
          fi
