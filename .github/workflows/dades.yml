name: Actualitza dades
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixa i converteix els CSV
        run: |
          mkdir -p data
          python3 - <<'PY'
          import csv, io, json, urllib.request, datetime
          t = datetime.date.today()
          y = t.year if t.month >= 7 else t.year - 1
          codes = [f"{(y-1)%100:02d}{y%100:02d}", f"{y%100:02d}{(y+1)%100:02d}"]
          def dt(s):
              for f in ("%d/%m/%Y", "%d/%m/%y"):
                  try: return datetime.datetime.strptime(s, f).strftime("%Y-%m-%d")
                  except ValueError: pass
          for lg in ("SP1", "SP2"):
              rows = []
              for c in codes:
                  try:
                      raw = urllib.request.urlopen(f"https://www.football-data.co.uk/mmz4281/{c}/{lg}.csv", timeout=30).read()
                  except Exception as e:
                      print(lg, c, "error", e); continue
                  txt = raw.decode("utf-8-sig", errors="replace")
                  for r in csv.DictReader(io.StringIO(txt)):
                      d = dt((r.get("Date") or "").strip())
                      if d and (r.get("FTHG") or "").strip() != "":
                          rows.append([d, r["HomeTeam"], r["AwayTeam"], int(r["FTHG"]), int(r["FTAG"])])
              if rows:
                  rows.sort()
                  json.dump(rows, open(f"data/{lg}.json", "w"), separators=(",", ":"), ensure_ascii=False)
                  print(lg, len(rows), "partits")
          PY
      - name: Desa els canvis
        run: |
          git config user.name "dades-bot"
          git config user.email "dades-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Actualitza dades" && git push)
