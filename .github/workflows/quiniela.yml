name: Actualitza butlleti de La Quiniela
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quiniela.yml'
permissions:
  contents: write
jobs:
  butlleti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarrega els 15 partits de la jornada publicada
        run: |
          python -m pip install --quiet beautifulsoup4
          python - <<'PY'
          import urllib.request, re, json, os, datetime
          from bs4 import BeautifulSoup
          url="https://www.quinielafutbol.info/proximas-jornadas-de-la-quiniela.html"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; QuiniGol/1.0)"})
          page=urllib.request.urlopen(req,timeout=45).read().decode("utf-8","replace")
          soup=BeautifulSoup(page,"html.parser")
          page_text=soup.get_text(" ",strip=True)
          jm=re.search(r"JORNADA\\s*(?:N[º°.]?\\s*)?(\\d+)",page_text,re.I)
          journey=int(jm.group(1)) if jm else 0
          selected=None
          for table in soup.find_all("table"):
              matches={}
              for tr in table.find_all("tr"):
                  cells=tr.find_all(["td","th"])
                  if len(cells)<2: continue
                  nm=re.search(r"^\\s*(\\d{1,2})\\s*$",cells[0].get_text(" ",strip=True))
                  if not nm: continue
                  n=int(nm.group(1))
                  team_text=cells[1].get_text(" ",strip=True)
                  image_text=" ".join(img.get("alt","") for img in cells[1].find_all("img"))
                  teams=re.sub(r"\\s+"," ",(team_text+" "+image_text)).strip()
                  teams=re.sub(r"^Image\\s*","",teams,flags=re.I)
                  pair=re.split(r"\\s*[-–—]\\s*",teams,maxsplit=1)
                  if len(pair)==2 and pair[0].strip() and pair[1].strip():
                      matches[n]={"home":pair[0].strip(),"away":pair[1].strip()}
              if len(matches)==15 and set(matches)==set(range(1,16)):
                  selected=(journey,matches)
                  break
          if not selected:
              raise SystemExit("No s'han trobat els 15 partits complets de la pròxima jornada; es conserva la quiniela anterior.")
          j,matches=selected\n          title="Pròxima jornada"
          result={"journey":str(j),"date":title,"matches":[{"number":i,"home":matches[i]["home"],"away":matches[i]["away"]} for i in range(1,16)],"source":"Calendari de La Quiniela (partits del butlletí publicat)","updated":datetime.datetime.utcnow().isoformat()+"Z"}
          os.makedirs("data",exist_ok=True)
          with open("data/quiniela.json","w",encoding="utf-8") as f: json.dump(result,f,ensure_ascii=False,indent=2)
          print("Jornada",j,"carregada amb els 15 partits:")
          for m in result["matches"]: print(m["number"],m["home"],"-",m["away"])
          PY
      - name: Desa els canvis
        run: |
          git config user.name "dades-bot"
          git config user.email "dades-bot@users.noreply.github.com"
          git add data/quiniela.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualitza els 15 partits de La Quiniela"
            git pull --rebase origin main
            git push
          else
            echo "El butlletí no ha canviat."
          fi
